<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Activity bar icon. VS Code paints it as a single-color silhouette, so only shape and opacity count. -->
  <defs>
    <!-- The trail fades in from the left and is solid at the star. -->
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="1.6" y1="16.9" x2="21.4" y2="8.1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="currentColor" stop-opacity="0.7"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="1"/>
    </linearGradient>
    <!-- Cuts a gap into the planet where the trail passes in front of it. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <path d="M1.6 16.9 A10.8 3.4 -24 0 0 21.4 8.1" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- Back of the orbit, behind the planet. -->
  <path d="M1.6 16.9 A10.8 3.4 -24 0 1 21.4 8.1" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Planet. -->
  <circle cx="11.5" cy="12.5" r="6.6" fill="currentColor" mask="url(#gap)"/>
  <!-- Star trail in front of the planet. -->
  <path d="M1.6 16.9 A10.8 3.4 -24 0 0 21.4 8.1" fill="none" stroke="url(#trail)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- The star at the head of the trail. -->
  <path d="M21 4.3 Q21 7.6 24 7.6 Q21 7.6 21 10.9 Q21 7.6 18 7.6 Q21 7.6 21 4.3 Z" fill="currentColor"/>
  <!-- Small stars. -->
  <circle cx="4" cy="5" r="0.75" fill="currentColor"/>
  <circle cx="7" cy="2.6" r="0.5" fill="currentColor" fill-opacity="0.7"/>
</svg>
